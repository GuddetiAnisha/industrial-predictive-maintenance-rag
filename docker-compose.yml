services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATA_DIR: /app/data
      USE_OLLAMA: "true"
      ALERT_WEBHOOK_URL: ""
      LIVE_INTERVAL_SECONDS: "3"
    volumes: ["maintenance-data:/app/data"]
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: maintenance
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  maintenance-data:
  postgres-data:
